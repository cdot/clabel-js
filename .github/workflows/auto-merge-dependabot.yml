name: Auto-merge Dependabot

on:
  check_suite:
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.check_suite.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible Dependabot pull requests
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          set -euo pipefail

          check_runs="$(gh api --paginate \
            "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | [.status, (.conclusion // "")] | @tsv')"
          status_result="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/status")"

          if [[ -z "$check_runs" ]] && [[ "$(jq '.total_count' <<<"$status_result")" -eq 0 ]]; then
            echo "No checks or commit statuses were reported; leaving the pull request open."
            exit 0
          fi

          while IFS=$'\t' read -r status conclusion; do
            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "At least one check run is incomplete or unsuccessful; leaving pull requests open."
              exit 0
            fi
          done <<<"$check_runs"

          if [[ "$(jq '.total_count' <<<"$status_result")" -gt 0 ]] &&
             [[ "$(jq -r '.state' <<<"$status_result")" != "success" ]]; then
            echo "At least one commit status is incomplete or unsuccessful; leaving pull requests open."
            exit 0
          fi

          default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          pull_numbers="$(gh api --paginate \
            "repos/$GH_REPO/commits/$HEAD_SHA/pulls?per_page=100" \
            --jq '.[].number')"

          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            pull="$(gh api "repos/$GH_REPO/pulls/$number")"

            if [[ "$(jq -r '.state' <<<"$pull")" != "open" ]] ||
               [[ "$(jq -r '.user.login' <<<"$pull")" != "dependabot[bot]" ]] ||
               [[ "$(jq -r '.base.ref' <<<"$pull")" != "$default_branch" ]] ||
               [[ "$(jq -r '.head.sha' <<<"$pull")" != "$HEAD_SHA" ]]; then
              continue
            fi

            gh pr merge "$number" --repo "$GH_REPO" --squash
          done <<<"$pull_numbers"
